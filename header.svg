<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<rect width="1000" height="300" fill="#050505"/>

<rect x="0" y="0" width="1000" height="300" fill="#18030a"/>

<!-- Neon glow -->
<circle cx="850" cy="150" r="120" fill="#ff0033" opacity="0.12"/>
<circle cx="850" cy="150" r="80" fill="#ff0033" opacity="0.15"/>

<!-- Web -->
<g fill="none" stroke="#ff1e3c" stroke-width="2" opacity="0.25">
<circle cx="850" cy="150" r="40"/>
<circle cx="850" cy="150" r="70"/>
<circle cx="850" cy="150" r="100"/>
<line x1="850" y1="40" x2="850" y2="260"/>
<line x1="740" y1="150" x2="960" y2="150"/>
<line x1="770" y1="70" x2="930" y2="230"/>
<line x1="930" y1="70" x2="770" y2="230"/>
</g>

<!-- Neon line -->
<rect x="720" y="45" width="5" height="210" rx="3" fill="#ff0033"/>

<!-- Title -->
<text x="70" y="125"
font-family="Arial, Helvetica, sans-serif"
font-size="64"
font-weight="bold"
letter-spacing="8"
fill="white">
H4YDAR
</text>

<!-- Red neon underline -->
<rect x="72" y="145" width="270" height="5" rx="3" fill="#ff0033"/>

<!-- Subtitle -->
<text x="75" y="190"
font-family="Arial, Helvetica, sans-serif"
font-size="22"
font-weight="bold"
letter-spacing="4"
fill="#ff4055">
CODE • CREATE • EXPLORE
</text>

<text x="75" y="225"
font-family="Arial, Helvetica, sans-serif"
font-size="15"
letter-spacing="3"
fill="white"
opacity="0.7">
SPIDER-SENSE // ONLINE
</text>

<!-- Corners -->
<path d="M0 0 H180 M0 0 V70"
stroke="#ff0033"
stroke-width="5"/>

<path d="M1000 300 H820 M1000 300 V230"
stroke="#ff0033"
stroke-width="5"/>

</svg>
